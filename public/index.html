<script>
const __shanParams=new URLSearchParams(location.search);const __shanPath=location.pathname.split('/').filter(Boolean);const SHOP=(__shanParams.get('shop')||(__shanPath[0]==='shop'?__shanPath[1]:'')||'').toUpperCase();const SHOP_KEY=__shanParams.get('key')||'';const SUPPORT_CODE=__shanParams.get('support')||'';const BRANCH_CODE=__shanParams.get('branch')||(__shanPath[2]==='branch'?__shanPath[3]:'');const INITIAL_SOFTWARE_LOGO='/assets/SHAN_POS_SYSTEMS_LOGO.png';let session=null,data={settings:{},softwareUpdate:{},customers:[],products:[],paymentWallets:[],paymentBillerMap:{},paymentServiceCharges:{}};const PAYMENT_METHODS=[['CASH','Cash'],['CREDIT','Credit'],['CHECK','Check'],['CARD','Card'],['BANK_TRANSFER','Bank Transfer'],['BANK_PAYMENT','Bank Payment'],['WALLET_PAYMENT','Wallet Payment'],['KOKO','Koko Payment'],['ONLINE_PAYMENT','Online Payment']];const $=id=>document.getElementById(id);const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function paymentMethodOptions(selected,includeCredit){return PAYMENT_METHODS.filter(x=>includeCredit||x[0]!=='CREDIT').map(x=>`<option value="${x[0]}" ${x[0]===selected?'selected':''}>${esc(x[1])}</option>`).join('')}
function req(o){return Object.assign({shopCode:SHOP,supportCode:SUPPORT_CODE,branchCode:BRANCH_CODE,deviceId:window.__shanDeviceId||''},o||{})}(function(){try{const k='shan-pos-device-id';let v=localStorage.getItem(k);if(!v){v=crypto.randomUUID();localStorage.setItem(k,v)}window.__shanDeviceId=v}catch(e){window.__shanDeviceId='browser-'+Date.now()}})();
function auth(){return session&&(session.token||session.pin)}
function has(k){return !!(session&&session.permissions&&session.permissions[k])}
let lastFailedCall_=null;
function showGlobalErrorPanel_(html){const box=$('globalErrorPanel'),body=$('globalErrorBody');if(!box||!body)return;body.innerHTML=html;box.classList.remove('hidden')}
function hideGlobalErrorPanel(){const box=$('globalErrorPanel'),body=$('globalErrorBody');if(!box||!body)return;box.classList.add('hidden');body.innerHTML='';lastFailedCall_=null}
function retryLastFailedCall(){if(!lastFailedCall_){hideGlobalErrorPanel();return;}const last=lastFailedCall_;showGlobalErrorPanel_(`<div><b>Retrying last action...</b></div><p class="hint">Please wait a moment.</p>`);call(last.name,last.payload,last.ok,last.fail)}
function permissionHelpHtml_(id,text){const raw=String(text||'');if(!/permission|supabase|database|access/i.test(raw))return'';return '<div><b>Access / System Help</b></div><div style="white-space:pre-wrap;margin-top:6px">'+esc(raw)+'</div><p class="hint">This build uses Netlify Functions with Supabase PostgreSQL. If an access error appears, check the central Permissions settings or contact the Master Owner.</p><button class="primary" type="button" onclick="retryLastFailedCall()">Retry Last Action</button>';}
function msg(id,text,ok){const e=$(id);if(!e)return;e.className='status '+(ok?'ok':'error');const help=!ok?permissionHelpHtml_(id,text):'';if(help){e.innerHTML=help;showGlobalErrorPanel_(help)}else e.textContent=text||''}
async function call(name,p,ok,fail){const bridge=e=>{const text=e&&e.message?e.message:String(e||'Unknown error');lastFailedCall_={name:name,payload:p,ok:ok,fail:fail};if(fail)fail(e);else alert(text)};try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name,payload:p||{}})});const contentType=r.headers.get('content-type')||'';const j=contentType.includes('application/json')?await r.json():{};if(!r.ok||j.ok===false)throw new Error(j.error||('Request failed ('+r.status+')'));if(ok)ok(j.data)}catch(e){bridge(e)}}
function loginEnter(e){if(e.key==='Enter')login()}function login(){const username=$('username').value.trim(),pin=$('pin').value.trim(),activationKey=SHOP_KEY||'';msg('loginStatus','',true);call('loginWithPin',req({username,pin,activationKey}),s=>{session=Object.assign(s,{pin});start();call('getInitialData',req({actorPin:auth()}),d=>{data=d||data;renderHome();renderProfileAvatar();renderSoftwareLogo();addWorkflowButton_();},e=>{const text=e&&e.message?e.message:String(e||'Unknown error');const show=permissionHelpHtml_('global',text);if(show)showGlobalErrorPanel_(show);else alert(text)});},e=>msg('loginStatus',e.message||String(e),false))}function renderFirstTimeSetupCard(){const card=$('dbSetupCard');if(!card)return;if(SHOP){card.innerHTML='<h3>First-time Software Activation</h3><p class="hint">Use this once when this customer software is first activated. Enter the Activation Key received from SHAN POS SYSTEMS and the customer\'s Activation / First Login PIN.</p><label>Activation Key *</label><input id="firstActivationKey" placeholder="4-part key from Master" autocomplete="off"><label style="margin-top:10px">Activation / First Login PIN *</label><input id="firstActivationPin" type="password" inputmode="numeric" maxlength="6" placeholder="Activation PIN from Master" autocomplete="one-time-code"><button class="primary" style="width:100%;margin-top:12px" onclick="activateFirstTimeSoftware()">Connect and Activate</button><div id="firstActivationStatus" class="status"></div>'}else{card.innerHTML='<h3>First-time Master Setup</h3><p class="hint">Use this only once on the main SHAN POS SYSTEMS deployment to create the Master Owner account. Customers do not see this setup on their customer software link.</p><label>Master username *</label><input id="bootstrapMasterUsername" autocomplete="username"><label style="margin-top:10px">New 6-digit Master PIN *</label><input id="bootstrapMasterPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><label style="margin-top:10px">Private Bootstrap Token *</label><input id="bootstrapMasterToken" type="password" autocomplete="off"><button class="primary" style="margin-top:12px;width:100%" onclick="createMasterOwnerUi()">Create Master Owner</button><div id="bootstrapMasterStatus" class="status"></div>'}}function openFirstTimeSetup(){const card=$('dbSetupCard');if(!card)return;renderFirstTimeSetupCard();card.classList.toggle('hidden');if(!card.classList.contains('hidden')){card.scrollIntoView({behavior:'smooth',block:'start'});const first=SHOP?$('firstActivationKey'):$('bootstrapMasterUsername');if(first)first.focus()}}function activateFirstTimeSoftware(){const key=$('firstActivationKey')&&$('firstActivationKey').value.trim(),pin=$('firstActivationPin')&&$('firstActivationPin').value.trim();if(!key||!/^[0-9A-Za-z-]{4,64}$/.test(key))return msg('firstActivationStatus','Enter the Activation Key received from SHAN POS SYSTEMS.',false);if(!/^\d{4,6}$/.test(pin))return msg('firstActivationStatus','Enter the 4 to 6 digit Activation / First Login PIN.',false);call('activateCustomerLicenseFromUi',req({activationKey:key,pin:pin}),r=>{msg('firstActivationStatus','Software activated successfully. You can now log in with your Username and PIN.',true);$('dbSetupCard').classList.add('hidden');if($('firstActivationKey'))$('firstActivationKey').value=''},e=>msg('firstActivationStatus',e.message||String(e),false))}function createMasterOwnerUi(){const username=$('bootstrapMasterUsername')&&$('bootstrapMasterUsername').value.trim(),pin=$('bootstrapMasterPin')&&$('bootstrapMasterPin').value.trim(),token=$('bootstrapMasterToken')&&$('bootstrapMasterToken').value.trim();if(!username)return msg('bootstrapMasterStatus','Enter the Master username.',false);if(!/^\d{6}$/.test(pin))return msg('bootstrapMasterStatus','Master PIN must be exactly 6 digits.',false);if(!token)return msg('bootstrapMasterStatus','Enter the private Bootstrap Token.',false);call('bootstrapMasterOwner',{username:username,pin:pin,bootstrapToken:token},()=>{msg('bootstrapMasterStatus','Master Owner created. Sign in with the new username and PIN.',true);$('bootstrapMasterUsername').disabled=true;$('bootstrapMasterPin').disabled=true;$('bootstrapMasterToken').disabled=true},e=>msg('bootstrapMasterStatus',e.message||String(e),false))}function addWorkflowButton_(){if(!session||$('workflowButton'))return;const b=document.createElement('button');b.id='workflowButton';b.className='muted';b.style.cssText='position:fixed;right:18px;bottom:18px;z-index:1000';if(session.role==='OWNER'){b.textContent='Master Notifications';b.onclick=()=>call('listMasterNotifications',{actorPin:auth()},rows=>modal('Master Notifications','<div class="card">'+(rows||[]).map(x=>'<p><b>'+esc(x.kind)+'</b><br>'+esc(x.title)+'<br><small>'+esc(x.customer_shop_code||'')+' · '+esc(x.created_at||'')+'</small></p>').join('')+'</div>'))}else if(session.role==='SUPPORT'){b.textContent='Support Notifications';b.onclick=()=>call('listSupportNotifications',{actorPin:auth()},rows=>modal('Support Notifications','<div class="card"><p class="hint">These notifications do not grant customer access. Ask Master for approved temporary access.</p>'+(rows||[]).map(x=>'<p><b>'+esc(x.title)+'</b><br><small>'+esc(x.created_at||'')+'</small></p>').join('')+'</div>'))}else{b.textContent='Request Support';b.onclick=()=>modal('Request Support','<div class="card"><label>Category</label><input id="customerSupportCategory" placeholder="Error, change, help"><label>Message</label><textarea id="customerSupportMessage"></textarea><button class="primary" style="margin-top:10px" onclick="submitCustomerSupportRequestUi()">Send to Master & Support Team</button><div id="customerSupportStatus" class="status"></div></div>')};document.body.appendChild(b)}window.submitCustomerSupportRequestUi=()=>call('submitCustomerSupportRequest',req({actorPin:auth(),category:$('customerSupportCategory').value,message:$('customerSupportMessage').value}),()=>msg('customerSupportStatus','Request sent. Master approval is required before any Support access.',true),e=>msg('customerSupportStatus',e.message||String(e),false))
function shellVisible(v){const shell=$('shell');if(shell)shell.classList.toggle('hidden',!v);const app=$('app');if(app)app.classList.toggle('hidden',!v)}
function start(){$('loginScreen').classList.add('hidden');shellVisible(true);$('profileButton').classList.remove('hidden');renderProfileAvatar();renderSoftwareLogo();$('pageName').textContent='Home';renderSidebar();renderHome();toggleCalculator(false)}
function renderSoftwareLogo(){const box=$('softwareLogoBox'),url=(data.settings&&data.settings.softwareLogoUrl)||INITIAL_SOFTWARE_LOGO;if(!box)return;if(url){box.innerHTML='<img src="'+esc(url)+'" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:10px">'}else box.textContent='SHAN'}
function renderProfileAvatar(){const b=$('profileButton');if(!b||!session)return;const url=session.profilePhotoUrl||'';if(url){b.textContent='';b.style.backgroundImage='url("'+String(url).replace(/"/g,'%22')+'")';b.style.backgroundSize='cover';b.style.backgroundPosition='center';}else{b.style.backgroundImage='';b.textContent=String(session.name||'◉').slice(0,1).toUpperCase()}}

/* Final Master dashboard recovery: keep the existing controls and add a stable
   summary/control panel so customer accounts cannot disappear from the Master UI. */
function shanMasterDashboardRecovery(){
  if(!session||session.role!=='OWNER'||SHOP)return;
  const list=$('masterShopList');
  if(!list)return;
  let panel=$('shanMasterAccountsPanel');
  if(!panel){
    panel=document.createElement('div');
    panel.id='shanMasterAccountsPanel';
    panel.className='card';
    panel.style.marginTop='16px';
    list.insertAdjacentElement('afterend',panel);
  }
  const rows=Array.isArray(masterShopRows)?masterShopRows:[];
  const active=rows.filter(x=>x.enabled).length;
  const suspended=rows.filter(x=>String(x.activationStatus||'').toUpperCase()==='SUSPENDED'||String(x.status||'').toUpperCase()==='SUSPENDED').length;
  const escv=v=>esc(v==null?'':String(v));
  const date=v=>v?new Date(v).toLocaleDateString():'-';
  panel.innerHTML='<h3>Customer Accounts — Master Owner Control</h3>'+
    '<p class="hint">Only the Master Owner can see and control these customer software links. Each created shop has its own unique link and shop code.</p>'+
    '<div class="grid three" style="margin-bottom:12px">'+
      '<div class="card"><b>Total accounts</b><div style="font-size:24px">'+rows.length+'</div></div>'+
      '<div class="card"><b>Active accounts</b><div style="font-size:24px">'+active+'</div></div>'+
      '<div class="card"><b>Suspended / inactive</b><div style="font-size:24px">'+suspended+'</div></div>'+
    '</div>'+
    (rows.length?'<div style="overflow:auto"><table><tr><th>Shop / company</th><th>Business</th><th>Unique link</th><th>Activation / expiry</th><th>Account status</th><th>Master actions</th></tr>'+rows.map(x=>{
      const suspendedNow=String(x.status||'').toUpperCase()==='SUSPENDED';
      const status=(x.enabled?'ACTIVE':'INACTIVE')+(suspendedNow?' / SUSPENDED':'');
      const expiry=x.activationCode?date(x.activationCodeExpiresAt):(x.demoExpiresAt?'Trial until '+date(x.demoExpiresAt):'Trial version');
      return '<tr><td><b>'+escv(x.shopName)+'</b><br><small>Code: '+escv(x.shopCode)+'</small></td>'+ 
        '<td>'+escv(x.businessType||'-')+'</td>'+
        '<td><button class="muted" onclick="copyShopLink(&quot;'+escv(x.link)+'&quot;)">Copy link</button><br><small>'+escv(x.link)+'</small></td>'+
        '<td><code>'+escv(x.activationCode||'Trial — no key')+'</code><br><small>'+escv(expiry)+(x.activationCodeExpired?' — EXPIRED':'')+'</small></td>'+
        '<td>'+escv(status)+'<br><small>'+escv(x.activityStatus||'OFFLINE')+'</small></td>'+
        '<td><button class="muted" onclick="toggleShop(&quot;'+escv(x.shopCode)+'&quot;,'+(!x.enabled)+')">'+(x.enabled?'Disable':'Activate')+'</button> '+
        '<button class="muted" onclick="shanSuspendCustomer(&quot;'+escv(x.shopCode)+'&quot;,'+(!suspendedNow)+')">'+(suspendedNow?'Reactivate':'Suspend')+'</button><br>'+
        '<button class="primary" onclick="editMasterShopPermissions(&quot;'+escv(x.shopCode)+'&quot;)">Roles / Permissions</button> '+
        '<button class="primary" onclick="editCustomerLogin(&quot;'+escv(x.shopCode)+'&quot;)">Username / PIN</button><br>'+
        '<button class="muted" onclick="shanDeleteCustomer(&quot;'+escv(x.shopCode)+'&quot;)">Delete account</button></td></tr>';
    }).join('')+'</table></div>':'<p>No customer accounts have been created yet. Use the shop creation form above.</p>')+
    '<div id="shanMasterActionStatus" class="status"></div>';
}
function shanSuspendCustomer(code,suspended){
  if(!confirm(suspended?'Suspend this customer software link?':'Reactivate this customer software link?'))return;
  call('setShopLinkSuspendedFromMaster',{actorPin:session.pin,shopCode:code,suspended:!!suspended},r=>{msg('shanMasterActionStatus',suspended?'Customer software suspended.':'Customer software reactivated.',true);loadMasterShops()},e=>msg('shanMasterActionStatus',e.message||String(e),false));
}
function shanDeleteCustomer(code){
  if(!confirm('Delete this customer account and its generated link from the Master list? This releases the name for reuse and does not delete any external customer backup.'))return;
  call('deleteShopLinkFromMaster',{actorPin:session.pin,shopCode:code},r=>{msg('shanMasterActionStatus','Customer account link deleted from Master control.',true);loadMasterShops()},e=>msg('shanMasterActionStatus',e.message||String(e),false));
}

function ensurePaymentCatalogUi(){

<script>
function shanPaymentOptions(list,label){return '<option value="">Select '+label+'</option>'+(list||[]).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')}
function shanRefreshWalletServiceList(){
  const wallet=$('psServiceWallet')&&$('psServiceWallet').value;
  const services=(data.paymentBillerMap&&data.paymentBillerMap[wallet])||[];
  if($('psServiceOld'))$('psServiceOld').innerHTML=shanPaymentOptions(services,'service / biller');

}
function shanRenderPaymentSetupMap(){
  const box=$('psCurrentMap');if(!box)return;
  const wallets=data.paymentWallets||[],map=data.paymentBillerMap||{};
  box.innerHTML=wallets.length?wallets.map(w=>'<p><b>'+esc(w)+'</b>: '+esc((map[w]||[]).join(', ')||'No services assigned')+'</p>').join(''):'<p class="hint">No wallets saved yet.</p>';
}
function shanPaymentSetupApply(type,action,oldId,nameId,walletId,statusId){
  const payload=req({actorPin:auth(),type:type,action:action,oldName:oldId&&$(oldId)?$(oldId).value:'',name:nameId&&$(nameId)?$(nameId).value:'',wallet:walletId&&$(walletId)?$(walletId).value:''});
  const direct=session&&(session.role==='OWNER'||session.role==='SUPER_ADMIN');
  call(direct?'managePaymentOption':'submitPaymentSetupRequest',payload,r=>{msg(statusId||'psStatus',direct?'Payment Setup updated.':'Payment Setup request sent for approval.',true);refreshInitialData(()=>openPaymentSetup())},e=>msg(statusId||'psStatus',e.message||String(e),false));
}
openPaymentSetup=function(){

function shanUniq(list){const seen={};return (list||[]).map(x=>String(x||'').trim()).filter(x=>{const k=x.toLowerCase();if(!x||seen[k])return false;seen[k]=true;return true})}
function shanMethodCode(label){const t=String(label||'').trim().toUpperCase();if(t==='CASH')return'CASH';if(t==='CREDIT')return'CREDIT';if(t==='CHECK'||t==='CHEQUE')return'CHECK';if(t==='CARD'||t==='CARD PAYMENT')return'CARD';if(t==='BANK TRANSFER')return'BANK_TRANSFER';if(t==='BANK PAYMENT')return'BANK_PAYMENT';if(t==='WALLET PAYMENT')return'WALLET_PAYMENT';if(t==='KOKO'||t==='KOKO PAY'||t==='KOKO PAYMENT')return'KOKO';if(t==='DIALOG PAY')return'DIALOG_PAY';if(t==='QR PAY'||t==='QR PAYMENT')return'ONLINE_PAYMENT';if(t==='ONLINE PAYMENT')return'ONLINE_PAYMENT';return t.replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
