name: SHAN POS SYSTEMS Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate project structure
        run: |
          test -f package.json
          test -f netlify.toml
          test -f public/index.html
          test -f public/_redirects
          test -f public/_headers
          test -f netlify/functions/api.js
          test -f supabase/schema.sql

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json OK')"

      - name: Validate API JavaScript syntax
        run: node --check netlify/functions/api.js

      - name: Validate Netlify configuration
        run: |
          grep -q 'publish = "public"' netlify.toml
          grep -q 'functions = "netlify/functions"' netlify.toml
          echo "netlify.toml OK"
