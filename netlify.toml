[build]
  command = "npm install --omit=dev"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/runtime-prelude.js", "netlify/functions/Code.gs", "netlify/functions/security-overrides.js"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
